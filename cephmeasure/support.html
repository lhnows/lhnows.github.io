<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>头影测量支持</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; line-height: 1.75; color: #111827; background: #f8fafc; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 72px; }
    h1 { margin: 0 0 8px; font-size: 32px; }
    h2 { margin: 30px 0 8px; font-size: 20px; }
    p, li { color: #475569; }
    a { color: #0a84ff; }
  </style>
</head>
<body>
  <main>
    <h1>头影测量支持</h1>
    <p>头影测量是一款在 iPhone 本地运行的侧位片头影测量工具。</p>
    <h2>使用方法</h2>
    <ol>
      <li>在首页选择一张头颅侧位片。</li>
      <li>提交影像，等待本地分析完成。</li>
      <li>在报告中按分析法查看指标，点击指标查看对应测量线和点。</li>
      <li>使用右上角 PDF 按钮预览或分享报告。</li>
    </ol>
    <h2>常见问题</h2>
    <p>分析结果仅在设备本地计算，不需要登录或网络连接。请使用清晰、完整且方向正确的侧位片；测量结果仅供辅助分析和研究。</p>
    <h2>联系开发者</h2>
    <p>问题反馈和功能建议请通过 <a href="https://github.com/lhnows">GitHub 主页</a> 联系开发者。</p>
    <p><a href="/cephmeasure/privacy.html">查看隐私政策</a></p>
  </main>
</body>
</html>
