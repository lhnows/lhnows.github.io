<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本地语记支持</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; line-height: 1.65; color: #111827; background: #f8fafc; }
    main { max-width: 760px; margin: 0 auto; padding: 48px 22px 72px; }
    h1 { font-size: 32px; margin: 0 0 8px; }
    h2 { margin-top: 32px; font-size: 20px; }
    h3 { margin-top: 22px; font-size: 17px; }
    p { margin: 12px 0; }
  </style>
</head>
<body>
  <main>
    <h1>本地语记支持</h1>
    <p>感谢使用本地语记。</p>

    <h2>常见问题</h2>

    <h3>是否需要联网？</h3>
    <p>不需要。录音和中文转写都在设备本地完成。</p>

    <h3>录音保存在哪里？</h3>
    <p>录音保存在 App 的本地空间中。删除 App 会同时删除本地录音和转写文本。</p>

    <h3>为什么首次转写会比较慢？</h3>
    <p>首次转写需要加载本地离线模型，后续同类操作通常会更快。</p>

    <h3>是否支持后台录音？</h3>
    <p>支持。开始录音后，锁屏或切换到其他 App 仍可继续录音。若从 App 切换器强制关闭应用，录音会停止。</p>

    <h2>联系方式</h2>
    <p>请在 App Store 页面通过开发者联系方式反馈问题。</p>
  </main>
</body>
</html>
